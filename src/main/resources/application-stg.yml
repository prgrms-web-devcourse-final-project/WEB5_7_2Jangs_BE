spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_PROD_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

  mail:
    host: mailpit
    port: 1025
    username: ${MAIL_USERNAME:test@docsa.com}
    password:
    smtp-auth: false
    starttls-enable: false
    starttls-required: false


  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

server:
  port: 8080
  ssl:
    enabled: false
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME}
        domain: ${SESSION_COOKIE_DOMAIN}
        secure: true
        same-site: None
      timeout: 24h # TODO: 테스트 완료 후 제거

app:
  cors:
    allowed-origin:
      - "https://stg.docsa.o-r.kr"
      - "https://staging.docsa-4hh.pages.dev"

perf:
  seed:
    run-id: ${PERF_SEED_RUN_ID:perf-stg}
    user-prefix: ${PERF_SEED_USER_PREFIX:perfuser}
    user-domain: ${PERF_SEED_USER_DOMAIN:test.com}
    user-count: ${PERF_SEED_USER_COUNT:0}
    docs-per-user: ${PERF_SEED_DOCS_PER_USER:20}
    branches-per-doc: ${PERF_SEED_BRANCHES_PER_DOC:1}
    commits-per-branch: ${PERF_SEED_COMMITS_PER_BRANCH:3}
    blocks-per-save: ${PERF_SEED_BLOCKS_PER_SAVE:50}
    blocks-per-commit: ${PERF_SEED_BLOCKS_PER_COMMIT:50}
    clean-before: ${PERF_SEED_CLEAN_BEFORE:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    servers:
      - url: ${SWAGGER_SERVER_URL}
        description: Production Server


decorator:
  datasource:
    datasource-proxy:
      enabled: true
      logging: slf4j
      multiline: true
      format-sql: true
      count-query: true
      query:
        enable-logging: true
        log-level: debug
      slow-query:
        enable-logging: true
        log-level: warn
        threshold: 100

logging:
  level:
    net.ttddyy.dsproxy.listener: DEBUG