spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/docsa
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  mail:
    # smtp: smtp.gmail.com, port: 587 / mailpit: localhost, port: 1025
    # gmail 로컬에서 사용시 smtp-auth, starttls-enable, starttls-required: true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:test@docsa.com}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${SMTP_AUTH:false}
    starttls-enable: ${STARTTLS_ENABLE:false}
    starttls-required: ${STARTTLS_REQUIRED:false}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
