spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/docsa
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  mail:
    # smtp: smtp.gmail.com, port: 587 / mailpit: localhost, port: 1025
    # gmail 로컬에서 사용시 smtp-auth, starttls-enable, starttls-required: true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:test@docsa.com}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${SMTP_AUTH:false}
    starttls-enable: ${STARTTLS_ENABLE:false}
    starttls-required: ${STARTTLS_REQUIRED:false}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true

decorator:
  datasource:
    datasource-proxy:
      enabled: true
      logging: slf4j
      multiline: true
      format-sql: true
      count-query: true
      query:
        enable-logging: true
        log-level: debug
      slow-query:
        enable-logging: true
        log-level: warn
        threshold: 100

logging:
  level:
    net.ttddyy.dsproxy.listener: DEBUG

server:
  port: 8080

app:
  cors:
    allowed-origin:
      - "http://localhost:3000"
      - "http://localhost:5173"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


perf:
  seed:
    user-count: ${PERF_SEED_USER_COUNT:0}
