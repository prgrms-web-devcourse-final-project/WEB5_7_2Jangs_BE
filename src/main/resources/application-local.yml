spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/docsa
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  mail:
    # smtp: smtp.gmail.com, port: 587 / mailpit: localhost, port: 1025
    # gmail 로컬에서 사용시 smtp-auth, starttls-enable, starttls-required: true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:test@docsa.com}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${SMTP_AUTH:false}
    starttls-enable: ${STARTTLS_ENABLE:false}
    starttls-required: ${STARTTLS_REQUIRED:false}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

decorator:
  datasource:
    datasource-proxy:
      enabled: false
      logging: slf4j
      multiline: true
      format-sql: true
      count-query: true
      query:
        enable-logging: false
        log-level: debug
      slow-query:
        enable-logging: true
        log-level: warn
        threshold: 100

logging:
  level:
    root: INFO
    io.ejangs.docsa: DEBUG
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:OFF}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:OFF}
    org.springframework: INFO
    org.mongodb.driver: WARN
    net.ttddyy.dsproxy.listener: ${LOG_LEVEL_DATASOURCE_PROXY:OFF}

server:
  port: 8080

app:
  cors:
    allowed-origin:
      - "http://localhost:3000"
      - "http://localhost:5173"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mongo:
  local-cleanup:
    enabled: true

perf:
  seed:
    run-id: ${PERF_SEED_RUN_ID:perf-local}
    user-prefix: ${PERF_SEED_USER_PREFIX:perfuser}
    user-domain: ${PERF_SEED_USER_DOMAIN:test.com}
    user-count: ${PERF_SEED_USER_COUNT:0}
    docs-per-user: ${PERF_SEED_DOCS_PER_USER:20}
    branches-per-doc: ${PERF_SEED_BRANCHES_PER_DOC:1}
    commits-per-branch: ${PERF_SEED_COMMITS_PER_BRANCH:3}
    blocks-per-save: ${PERF_SEED_BLOCKS_PER_SAVE:50}
    blocks-per-commit: ${PERF_SEED_BLOCKS_PER_COMMIT:50}
    clean-before: ${PERF_SEED_CLEAN_BEFORE:true}
