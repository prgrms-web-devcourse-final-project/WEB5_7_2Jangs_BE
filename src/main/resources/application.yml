spring:
  profiles:
    active: local

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGO_URI}}
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:true}
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
      connect-timeout: 200ms
      timeout: 200ms

  mail:
    connection-timeout: 5000
    timeout: 5000
    write-timeout: 5000

management:
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    distribution:
      percentiles:
        all: 0.5, 0.9, 0.99
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        method.timed: true

auth:
  signup-code-cache-name: signupCodeCache
  passcode-cache-name: passCodeCache
  pwd-reset-code-cache-name: pwdResetCodeCache
  resend-limit-cache-name: resendLimitCache

commit:
  content:
    cache:
      provider: ${COMMIT_CONTENT_CACHE_PROVIDER:none}
      ttl: ${COMMIT_CONTENT_CACHE_TTL:PT10M}
      maximum-size: ${COMMIT_CONTENT_CACHE_MAXIMUM_SIZE:400}
      key-prefix: ${COMMIT_CONTENT_CACHE_KEY_PREFIX:docsa:experiment:commit-content:}

default:
  branch: main

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET}
      presigned-expire-minutes: ${AWS_PRESIGNED_EXPIRE_MIN:5}
      public-base-url: ${CDN_URL}

mongo:
  delete:
    outbox:
      worker:
        enabled: true
        fixed-delay: PT1M
        initial-delay: PT0S

s3:
  delete:
    outbox:
      worker:
        enabled: true
        fixed-delay: PT1M
        initial-delay: PT0S

domain:
  event:
    outbox:
      worker:
        enabled: true
        fixed-delay: PT10S
        initial-delay: PT5S
