spring:
  profiles:
    active: local

  data:
    mongodb:
      uri: ${MONGO_URI}

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cache:
    cache-names:
      - signupCodeCache
      - passCodeCache
      - pwdResetCodeCache
    caffeine:
      spec: maximumSize=10000, expireAfterWrite=4m

auth:
  signup-code-cache-name: signupCodeCache
  passcode-cache-name: passCodeCache
  pwd-reset-code-cache-name: pwdResetCodeCache

default:
  branch: main