spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/docsa-test}

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:test-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cache:
    cache-names:
      - signupCodeCache
      - passCodeCache
    caffeine:
      spec: maximumSize=10000, expireAfterWrite=4m

auth:
  signup-code-cache-name: signupCodeCache
  passcode-cache-name: passCodeCache
  pwd-reset-code-cache-name: pwdResetCodeCache

default:
  branch: main

app:
  cors:
    allowed-origin:

mongo:
  delete:
    outbox:
      worker:
        fixed-delay: PT1M
        initial-delay: PT24H

s3:
  delete:
    outbox:
      worker:
        fixed-delay: PT1M
        initial-delay: PT24H

domain:
  event:
    outbox:
      worker:
        fixed-delay: PT1M
        initial-delay: PT24H


cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: docsa-test-bucket
      presigned-expire-minutes: 5
      public-base-url: https://cdn.test.invalid
logging:
  level:
    root: WARN
    io.ejangs.docsa: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework: WARN
    org.springframework.test: WARN
    org.springframework.transaction: WARN
    org.springframework.data.mongodb: WARN
    org.mongodb.driver: WARN
    com.zaxxer.hikari: WARN
