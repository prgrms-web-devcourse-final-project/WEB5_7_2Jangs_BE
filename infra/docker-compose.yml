name: docsa

services:
  app:
    image: ghcr.io/prgrms-web-devcourse-final-project/docsa-backend:dev
    container_name: docsa-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - docsa_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:9.4.0
    container_name: docsa-mysql
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/logs/prod:/var/log/mysql
    networks:
      - docsa_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    volumes:
      - ./mysql/exporter.cnf:/etc/.mysqld_exporter.cnf:ro
    command:
      - '--web.listen-address=:9104'
      - '--config.my-cnf=/etc/.mysqld_exporter.cnf'
      - '--mysqld.address=docsa-mysql:3306'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.engine_innodb_status'
      - '--collect.info_schema.tablestats'
      - '--collect.info_schema.processlist'
      # - '--collect.perf_schema.eventsstatements'
      # - '--collect.perf_schema.eventswaits'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - docsa_net

  # ===== METRICS =====
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - docsa_net

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command: ['--path.rootfs=/host']
    volumes:
      - /:/host:ro,rslave
    networks:
      - docsa_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - cadvisor
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - docsa_net
      - docsa_monitoring_net

  # ===== LOGS =====
  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - docsa_net

  promtail:
    image: grafana/promtail:3.5
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mysql/logs:/mnt/mysql-logs:ro
    networks: [docsa_net]

  # ===== DASHBOARD =====
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on: [prometheus, loki]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: 'https://api.docsa.o-r.kr/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    networks: [docsa_net]


volumes:
  mysql_data:
  prom_data:
  loki_data:
  grafana_data:

networks:
  docsa_net:
  docsa_monitoring_net:
    external: true
    name: docsa_monitoring_net
