name: docsa-stg

services:
  app:
    image: ghcr.io/prgrms-web-devcourse-final-project/docsa-backend:staging
    container_name: docsa-app-stg
    restart: unless-stopped
    env_file: .stg.env
    depends_on:
       mysql:
          condition: service_healthy
    networks:
      - docsa_stg_net
      - docsa_monitoring_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    command: ["--webroot", "/mailpit/"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - mailpit_data:/data
    networks:
      - docsa_stg_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/mailpit/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:9.4.0
    container_name: docsa-mysql-stg
    restart: unless-stopped
    env_file: .stg.env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - stg_mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/logs/staging:/var/log/mysql
    networks:
      - docsa_stg_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter-stg
    restart: unless-stopped
    volumes:
      - ./mysql/exporter.cnf:/etc/.mysqld_exporter.cnf:ro
    command:
      - '--web.listen-address=:9104'
      - '--config.my-cnf=/etc/.mysqld_exporter.cnf'
      - '--mysqld.address=docsa-mysql-stg:3306'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.engine_innodb_status'
      - '--collect.info_schema.tablestats'
      - '--collect.info_schema.processlist'
      # - '--collect.perf_schema.eventsstatements'
      # - '--collect.perf_schema.eventswaits'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - docsa_stg_net
      - docsa_monitoring_net

  nginx:
    image: nginx:stable-alpine-slim
    container_name: docsa-nginx-stg
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.stg.conf:/etc/nginx/nginx.conf:ro
      - /srv/gateway/certbot/etc:/etc/letsencrypt:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      app:
        condition: service_started
    networks:
      - docsa_stg_net


volumes:
  stg_mysql_data:
  mailpit_data:

networks:
  docsa_stg_net:
  docsa_monitoring_net:
    external: true
    name: docsa_monitoring_net
