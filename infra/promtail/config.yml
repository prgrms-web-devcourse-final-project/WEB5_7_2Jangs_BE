server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  # Docker 컨테이너 stdout/err
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    pipeline_stages:
      - docker: {}
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: docsa|docsa-stg
        action: keep
      - { source_labels: ['__meta_docker_container_name'], target_label: 'container', regex: '/(.*)' }
      - { source_labels: ['__meta_docker_container_label_com_docker_compose_service'], target_label: 'compose_service' }
      - { source_labels: ['__meta_docker_container_label_com_docker_compose_project'], target_label: 'compose_project' }
      - { source_labels: ['__meta_docker_container_log_stream'], target_label: 'stream' }

  # 시스템 로그
  - job_name: syslog
    static_configs:
      - targets: [ localhost ]
        labels:
          job: syslog
          __path__: /var/log/syslog

  - job_name: mysql-slowlog-production
    static_configs:
      - targets: [ localhost ]
        labels:
          job: mysql-slowlog
          compose_service: mysql
          environment: production
          __path__: /mnt/mysql-logs/prod/slow.log
    pipeline_stages:
      - multiline:
          firstline: '^# Time:'
          max_lines: 200
          max_wait_time: 3s

  - job_name: mysql-slowlog-staging
    static_configs:
      - targets: [ localhost ]
        labels:
          job: mysql-slowlog
          compose_service: mysql
          environment: staging
          __path__: /mnt/mysql-logs/staging/slow.log
    pipeline_stages:
      - multiline:
          firstline: '^# Time:'
          max_lines: 200
          max_wait_time: 3s
